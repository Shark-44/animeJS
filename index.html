<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ciel">
        <div class="soleil">
            <div class="rayon" style="transform: rotate(0deg)"></div>
            <div class="rayon" style="transform: rotate(45deg)"></div>
            <div class="rayon" style="transform: rotate(90deg)"></div>
            <div class="rayon" style="transform: rotate(135deg)"></div>
            <div class="rayon" style="transform: rotate(180deg)"></div>
            <div class="rayon" style="transform: rotate(225deg)"></div>
            <div class="rayon" style="transform: rotate(270deg)"></div>
            <div class="rayon" style="transform: rotate(315deg)"></div>
          </div>
        <input class="styled" id="start" type="button" value="Start animation"/>
        <input class="rewind" id="rewind" type="button" value="Retour soleil"/>
    </div>
    <script src="script.js"></script>
</body>
</html>
